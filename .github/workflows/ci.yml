name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: node dist/cli.js test --demo --json
      - run: node dist/cli.js list --config examples/vooma-mcp.example.json || true
      - run: node dist/cli.js analyze --demo --json
      - run: node dist/cli.js competitors --category testing | head -20
