name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - run: test "$(node dist/cli.js -V)" = "$(node -p "require('./package.json').version")"
      - run: node dist/cli.js test --demo --json
      - run: node dist/cli.js list --config examples/vooma-mcp.example.json || true
      - run: node dist/cli.js analyze --demo --json
      - run: node dist/cli.js competitors --category testing | head -20
